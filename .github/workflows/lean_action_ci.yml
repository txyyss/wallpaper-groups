name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build with warnings treated as errors
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build-args: "--wfail"

      - name: Reject forbidden Lean placeholders
        shell: bash
        run: |
          set +e
          git grep --line-number --word-regexp --extended-regexp \
            '(sorry|sorryAx|admit|axiom|unsafe)' \
            -- WallpaperGroups WallpaperGroups.lean
          scan_rc=$?
          set -e
          case "$scan_rc" in
            0)
              echo "::error::Found a forbidden Lean placeholder, axiom, or unsafe declaration."
              exit 1
              ;;
            1)
              ;;
            *)
              echo "::error::The forbidden-token scan failed with status $scan_rc."
              exit "$scan_rc"
              ;;
          esac

      - name: Check whitespace errors
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD
